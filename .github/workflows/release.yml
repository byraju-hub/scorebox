name: 릴리즈 ZIP 만들기

# GitHub 에서 릴리즈를 게시하면 설치용 ZIP(ScoreBox-<버전>.zip)을 만들어 그 릴리즈에 붙입니다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'ZIP 을 붙일 릴리즈 태그 (예: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: ZIP 만들기 (앱 파일만, 테스트·개발용 파일 제외)
        run: |
          mkdir -p dist/ScoreBox
          cp -r scorebox.html css js fonts README.md GUIDE.md dist/ScoreBox/
          cd dist && zip -qr "ScoreBox-${TAG}.zip" ScoreBox
          unzip -l "ScoreBox-${TAG}.zip"
      - name: 릴리즈에 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/ScoreBox-${TAG}.zip" --clobber
