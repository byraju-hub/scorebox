name: 자동 테스트

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: 화면 캡처 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/output/
          if-no-files-found: ignore
